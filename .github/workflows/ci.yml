name: CI

on:
  push:
    branches:
      - develop
      - feature/**
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Find and test all solutions
        run: |
          echo "Finding all .sln files..."
          solutions=$(find . -name "*.sln")
          for sln in $solutions; do
            echo "Restoring $sln"
            dotnet restore "$sln"
            echo "Building $sln"
            dotnet build "$sln" --no-restore --configuration Release
            echo "Testing $sln"
            dotnet test "$sln" --no-build --configuration Release
          done
