<div class="categories-container">
  <mat-card class="categories-card">
    <div class="card-header">
      <div class="title">
        <h2>Categorie</h2>
        <div class="subtitle">Gestisci le categorie</div>
      </div>

      <button
        mat-fab
        color="primary"
        class="add-button"
        (click)="openCreateDialog()"
        aria-label="Aggiungi categoria"
        matTooltip="Nuova categoria"
        matTooltipPosition="below"
        matTooltipShowDelay="250"
      >
        <mat-icon>add</mat-icon>
      </button>
    </div>

    <div *ngIf="!loading()">
      <app-table-view
        [data]="categories()"
        [config]="tableConfig"
        (rowAction)="onTableRowAction($event)"
      ></app-table-view>
    </div>
  </mat-card>
</div>
