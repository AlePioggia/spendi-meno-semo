<div class="login-container">
  <mat-card class="login-card">
    <mat-card-title class="login-title">Registrati</mat-card-title>

    <app-input-field
      label="Username"
      [value]="username"
      (valueChange)="username.set($event)"
      class="login-input"
    ></app-input-field>

    <app-input-field
      label="Email"
      [value]="email"
      (valueChange)="email.set($event)"
      class="login-input"
    ></app-input-field>

    <app-input-field
      label="Password"
      type="password"
      [value]="password"
      (valueChange)="password.set($event)"
      class="login-input"
    ></app-input-field>

    <app-input-field
      label="Conferma Password"
      type="password"
      [value]="confirmPassword"
      (valueChange)="confirmPassword.set($event)"
      class="login-input"
    ></app-input-field>

    <button
      mat-raised-button
      color="primary"
      (click)="register()"
      [disabled]="loading()"
      class="login-button"
    >
      Registrati
      @if(loading()) {
        <mat-progress-spinner
          *ngIf="loading()"
          mode="indeterminate"
          diameter="20"
          class="spinner"
        ></mat-progress-spinner>
      }
    </button>

    <p class="register-text">
      Hai già un account? <a routerLink="/login">Accedi</a>
    </p>
  </mat-card>
</div>
